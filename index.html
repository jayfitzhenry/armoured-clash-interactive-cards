<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armoured Clash Unit Cards</title>
<meta name="description" content="Pick your units and look up Armoured Clash unit cards and rules fast.">
<meta name="theme-color" content="#3d4a33" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#273022" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AC Cards">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>Armoured Clash <span>unit cards</span></h1>
    <div class="faction-switch" id="factions" role="group" aria-label="Faction"></div>
  </div>
  <div class="search-row">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" placeholder="Search units, traits, rules, weapon qualities" autocomplete="off" enterkeyhint="search">
      <kbd>/</kbd>
    </label>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="units" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>All units</span></button>
    <button role="tab" data-tab="force" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/></svg><span>My force <b id="forceCount">0</b></span></button>
    <button role="tab" data-tab="rules" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 9h6M9 13h6"/></svg><span>Rules</span></button>
    <button role="tab" data-tab="score" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 21h8"/></svg><span>Score</span></button>
  </nav>
  <div class="filters" id="filters"></div>
</header>

<main class="layout">
  <section class="list-pane" id="listPane" aria-live="polite"></section>
  <aside class="detail-pane" id="detail" aria-label="Unit card" hidden></aside>
</main>

<div class="pop" id="pop" role="dialog" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js?v=6"></script>
</body>
</html>
